[tool.poetry]
name = "mcp-proxmox"
version = "0.1.0"
description = "Read-only MCP server for the Proxmox VE API"
authors = ["ADevillers"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/ADevillers/mcp-proxmox"
repository = "https://github.com/ADevillers/mcp-proxmox"
packages = [{ include = "mcp_proxmox", from = "src" }]
keywords = ["mcp", "proxmox", "homelab"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]

[tool.poetry.dependencies]
python = "^3.11"
httpx = ">=0.27"
mcp = ">=2.2,<3"
pydantic = ">=2.0"
pydantic-settings = ">=2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.24"
respx = ">=0.21"
ruff = ">=0.8"

[tool.poetry.scripts]
mcp-proxmox = "mcp_proxmox.server:main"
mcp-proxmox-check = "mcp_proxmox.check:main"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
